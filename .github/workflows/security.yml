# Security checks on every push and pull request: leaked secrets, known-vulnerable packages, type errors and the automatic tests (including the access rules).
name: Security checks

on:
  push:
    branches: [main, production]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # every Monday morning, to catch newly published vulnerabilities

permissions:
  contents: read

jobs:
  secrets:
    name: Leaked secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, not only the last commit
      - name: Scan the repository history
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source /repo --redact --no-banner --report-format json --report-path /repo/gitleaks-report.json
      - name: Summary of findings (rule and file only; the values stay redacted)
        if: failure()
        run: |
          jq -r '.[] | "\(.RuleID)\t\(.File)"' gitleaks-report.json | sort | uniq -c | sort -rn | head -40
          echo "--- by rule"; jq -r '.[].RuleID' gitleaks-report.json | sort | uniq -c | sort -rn
          echo "--- outside the catalogue data"; jq -r '.[] | select(.File | startswith("apps/web/data/catalog/") | not) | "\(.RuleID)\t\(.File):\(.StartLine)\t\(.Commit[0:7])"' gitleaks-report.json | head -40

  app:
    name: Packages, types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Known vulnerabilities in the packages the site ships
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        # Next.js generates the page and layout types that the code refers to.
        run: npx next typegen && npx tsc --noEmit
      - name: Tests (matching, data, access rules, public form)
        run: npm test
